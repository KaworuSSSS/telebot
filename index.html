<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Navegador Nova</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="browser">

    <!-- Pestañas -->
    <div class="tabs">
      <div class="tab active">
        <span>🌐</span>
        <span class="tab-title">Nueva pestaña</span>
        <button class="close-tab">×</button>
      </div>

      <button class="new-tab" id="newTab">+</button>
    </div>

    <!-- Barra de navegación -->
    <div class="toolbar">

      <button id="back" title="Atrás">←</button>
      <button id="forward" title="Adelante">→</button>
      <button id="reload" title="Recargar">⟳</button>

      <div class="address-container">
        <span>🔒</span>
        <input
          id="address"
          type="text"
          placeholder="Busca o escribe una dirección"
          value=""
        >
      </div>

      <button id="home" title="Inicio">⌂</button>
      <button id="bookmark" title="Favorito">☆</button>

    </div>

    <!-- Contenido -->
    <main id="content">

      <section class="home-page">

        <div class="logo">
          <span>✦</span> Nova
        </div>

        <p>Tu navegador, tu espacio.</p>

        <div class="search-box">
          <span>🔍</span>
          <input
            id="homeSearch"
            type="text"
            placeholder="Buscar en Internet..."
          >
        </div>

        <div class="shortcuts">
          <button data-url="https://www.google.com">
            <span>G</span>
            Google
          </button>

          <button data-url="https://www.wikipedia.org">
            <span>W</span>
            Wikipedia
          </button>

          <button data-url="https://github.com">
            <span>🐙</span>
            GitHub
          </button>
        </div>

      </section>

      <iframe
        id="webview"
        title="Página web"
        hidden
      ></iframe>

    </main>

  </div>

  <script src="script.js"></script>

</body>
</html>
