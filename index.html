<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enviar mensaje a Telegram</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contenedor {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #229ED9;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #168ac0;
        }

        #resultado {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="contenedor">

    <h1>Enviar mensaje</h1>

    <form id="formulario">

        <label for="nombre">Nombre</label>

        <input
            type="text"
            id="nombre"
            placeholder="Tu nombre"
            required
        >

        <label for="mensaje">Mensaje</label>

        <textarea
            id="mensaje"
            placeholder="Escribe tu mensaje..."
            required
        ></textarea>

        <button type="submit">
            Enviar a Telegram
        </button>

    </form>

    <div id="resultado"></div>

</div>


<script>

    const formulario = document.getElementById("formulario");
    const resultado = document.getElementById("resultado");


    formulario.addEventListener("submit", async function(event) {

        event.preventDefault();

        const nombre = document.getElementById("nombre").value;
        const mensaje = document.getElementById("mensaje").value;


        resultado.textContent = "Enviando...";


        // Más adelante aquí conectaremos
        // nuestro backend con Telegram.

        console.log("Nombre:", nombre);
        console.log("Mensaje:", mensaje);


        resultado.textContent = "Formulario recibido correctamente.";

    });

</script>

</body>
</html>
