<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Contacto</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 20px;

            background:
                radial-gradient(
                    circle at top,
                    #243b55,
                    #141e30 70%
                );

            color: #ffffff;
        }

        .contenedor {
            width: 100%;
            max-width: 520px;

            padding: 35px;

            background: rgba(255, 255, 255, 0.08);

            border: 1px solid rgba(255, 255, 255, 0.15);

            border-radius: 20px;

            backdrop-filter: blur(15px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.35);
        }

        .icono {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #229ED9;

            border-radius: 50%;

            font-size: 35px;
        }

        h1 {
            text-align: center;

            margin-bottom: 10px;

            font-size: 30px;
        }

        .descripcion {
            text-align: center;

            color: #cbd5e1;

            line-height: 1.5;

            margin-bottom: 30px;
        }

        .campo {
            margin-bottom: 20px;
        }

        label {
            display: block;

            margin-bottom: 8px;

            font-weight: bold;

            color: #e2e8f0;
        }

        input,
        textarea {
            width: 100%;

            padding: 14px 16px;

            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 10px;

            outline: none;

            background: rgba(0, 0, 0, 0.2);

            color: white;

            font-size: 16px;

            transition: 0.2s;
        }

        input::placeholder,
        textarea::placeholder {
            color: #94a3b8;
        }

        input:focus,
        textarea:focus {
            border-color: #229ED9;

            box-shadow:
                0 0 0 3px rgba(34, 158, 217, 0.2);
        }

        textarea {
            min-height: 140px;

            resize: vertical;
        }

        button {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #229ED9;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #168ac0;

            transform: translateY(-1px);
        }

        button:disabled {
            opacity: 0.6;

            cursor: not-allowed;

            transform: none;
        }

        #resultado {
            margin-top: 20px;

            padding: 12px;

            border-radius: 10px;

            text-align: center;

            display: none;
        }

        #resultado.exito {
            display: block;

            background: rgba(34, 197, 94, 0.15);

            color: #86efac;
        }

        #resultado.error {
            display: block;

            background: rgba(239, 68, 68, 0.15);

            color: #fca5a5;
        }

        .pie {
            margin-top: 25px;

            text-align: center;

            font-size: 13px;

            color: #94a3b8;
        }

        @media (max-width: 600px) {

            .contenedor {
                padding: 25px 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>


<body>

    <main class="contenedor">

        <div class="icono">
            ✈️
        </div>

        <h1>Envíame un mensaje</h1>

        <p class="descripcion">
            Completa el formulario y tu mensaje será enviado
            directamente.
        </p>


        <form id="formulario">

            <div class="campo">

                <label for="nombre">
                    Nombre
                </label>

                <input
                    type="text"
                    id="nombre"
                    name="nombre"
                    placeholder="Escribe tu nombre"
                    maxlength="100"
                    required
                >

            </div>


            <div class="campo">

                <label for="mensaje">
                    Mensaje
                </label>

                <textarea
                    id="mensaje"
                    name="mensaje"
                    placeholder="Escribe tu mensaje..."
                    maxlength="2000"
                    required
                ></textarea>

            </div>


            <button
                type="submit"
                id="boton"
            >
                📩 Enviar mensaje
            </button>

        </form>


        <div id="resultado"></div>


        <div class="pie">
            Tu mensaje será procesado de forma segura.
        </div>

    </main>


    <script>

        const formulario =
            document.getElementById("formulario");

        const boton =
            document.getElementById("boton");

        const resultado =
            document.getElementById("resultado");


        formulario.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const nombre =
                    document
                        .getElementById("nombre")
                        .value
                        .trim();


                const mensaje =
                    document
                        .getElementById("mensaje")
                        .value
                        .trim();


                if (!nombre || !mensaje) {

                    mostrarResultado(
                        "Completa todos los campos.",
                        "error"
                    );

                    return;
                }


                boton.disabled = true;

                boton.textContent =
                    "⏳ Enviando...";


                /*
                 * AQUÍ CONECTAREMOS NUESTRO BACKEND
                 *
                 * NO ponemos aquí el token de Telegram.
                 *
                 * Más adelante utilizaremos algo como:
                 *
                 * fetch("URL_DE_NUESTRO_BACKEND", {
                 *     method: "POST",
                 *     headers: {
                 *         "Content-Type": "application/json"
                 *     },
                 *     body: JSON.stringify({
                 *         nombre: nombre,
                 *         mensaje: mensaje
                 *     })
                 * });
                 */


                console.log({
                    nombre: nombre,
                    mensaje: mensaje
                });


                // TEMPORAL: simulamos el envío.

                await new Promise(
                    resolve => setTimeout(resolve, 1000)
                );


                mostrarResultado(
                    "✅ Mensaje preparado correctamente.",
                    "exito"
                );


                formulario.reset();


                boton.disabled = false;

                boton.textContent =
                    "📩 Enviar mensaje";

            }
        );


        function mostrarResultado(texto, tipo) {

            resultado.textContent = texto;

            resultado.className = tipo;
        }

    </script>

</body>
</html>
